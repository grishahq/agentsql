name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install SDK and development checks
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: |
          python -m ruff check .
          python -m mypy
      - name: Correctness and process tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Verify installed distribution and documented examples
        run: python tools/verify_release.py
      - name: Keep release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            dist/*
            coverage.xml
          if-no-files-found: error
          retention-days: 14
